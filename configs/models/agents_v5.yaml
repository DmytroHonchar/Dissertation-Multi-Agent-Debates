# PRE-PILOT FREEZE CANDIDATE - 2026-09-03 (D015 and D018).
#
# Use this version unchanged for Milestone 2 and the 20-question pilot. If the
# pilot exposes a genuine configuration fault, create agents_v6; never edit
# this file after a real run identifies itself as agents_v5.
#
# Token ceilings come from the live Round 1 probes. On the two clearly
# well-formed questions, every model finished with at least twice the headroom
# it used. The malformed physics item and ambiguous maths/economics items are
# recorded as diagnostic evidence, not used to inflate every model's ceiling.
# Qwen's reasoning cap is a best-effort request: Parasail reported 2740
# reasoning tokens against the requested 2048 on test:9622, so the 3072 total
# ceiling remains the real cost and termination guard.
#
# Each provider is an exact OpenRouter endpoint tag where one is exposed.
# Fallbacks are disabled: if a pin is unavailable, the call retries the same
# endpoint once and is then stored as API_ERROR. It must never silently switch
# provider during the experiment.

registry:
  name: agents_v5
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

defaults:
  temperature: 0
  top_p: 1.0
  max_tokens: 1024
  allow_provider_fallbacks: false
  require_parameters: true

agents:
  agent_llama:
    slug: meta-llama/llama-4-maverick
    display_name: Llama 4 Maverick
    developer: Meta
    # Three successful recorded calls through DigitalOcean; one exact endpoint.
    pinned_provider: digitalocean

  agent_qwen:
    slug: qwen/qwen3.8-27b
    display_name: Qwen3.8 27B
    developer: Alibaba
    max_tokens: 3072
    # Best-effort control, not assumed to be a hard guarantee. D018.
    reasoning_max_tokens: 2048
    # Five recorded calls and the controlled maths comparison used Parasail.
    pinned_provider: parasail/fp8

  agent_mistral:
    slug: mistralai/mistral-large-2512
    display_name: Mistral Large 2512
    developer: Mistral AI
    # Mistral is the sole provider; the EU endpoint had the best one-day
    # availability of its three endpoint variants in the 2026-09-03 snapshot.
    pinned_provider: mistral/eu

  agent_deepseek:
    slug: deepseek/deepseek-v4-pro-0813
    display_name: DeepSeek V4 Pro
    developer: DeepSeek
    max_tokens: 2048
    # Two successful recorded calls; avoids the first-party endpoint rejected
    # by the account's data-policy restrictions during the earlier smoke test.
    pinned_provider: digitalocean

  agent_gemma:
    slug: google/gemma-4-31b-it
    display_name: Gemma 4 31B IT
    developer: Google
    # Three successful recorded calls; exact fp8 variant prevents a silent
    # move to DeepInfra's fp4/turbo or other endpoint variants.
    pinned_provider: deepinfra/fp8
