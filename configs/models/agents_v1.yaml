registry:
  name: agents_v1
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

# Applied to every agent unless the agent overrides the same key.
defaults:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 1024
  # Pin generation to a single upstream provider so a silent failover cannot
  # change quantisation or serving stack halfway through a run.
  allow_provider_fallbacks: false
  require_parameters: true

agents:
  agent_llama:
    slug: meta-llama/llama-4-maverick
    display_name: Llama 4 Maverick
    developer: Meta

  agent_qwen:
    slug: qwen/qwen3.8-27b
    display_name: Qwen3.8 27B
    developer: Alibaba

  agent_mistral:
    slug: mistralai/mistral-large-2512
    display_name: Mistral Large 2512
    developer: Mistral AI

  agent_deepseek:
    slug: deepseek/deepseek-v4-pro-0813
    display_name: DeepSeek V4 Pro
    developer: DeepSeek

  agent_gemma:
    slug: google/gemma-4-31b-it
    display_name: Gemma 4 31B IT
    developer: Google
